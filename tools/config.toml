# Override swc's config for alpine linux build image.
[target.aarch64-unknown-linux-musl]
linker = "aarch64-alpine-linux-musl-gcc"

# Growing a WebAssembly memory detaches its ArrayBuffer, and detaching a buffer
# that the bindings hold views of invalidates V8's ArrayBufferDetaching
# protector, which slows typed-array code in the whole process for the rest of
# its life (nodejs/node#67632). Two independent measures keep it intact:
#
# - 16 MiB of initial memory, which the allocator uses before it grows the
#   memory. A source of 384 KB doesn't grow the memory, and one of 512 KB
#   does.
# - A declared maximum, which `WebAssembly.Memory.prototype.toResizableBuffer()`
#   requires. tools/patch-wasm.mjs has the bindings call it, so that growing
#   resizes the buffer in place instead of detaching it.
[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "link-arg=--initial-memory=16777216",
    "-C", "link-arg=--max-memory=4294967296",
]
